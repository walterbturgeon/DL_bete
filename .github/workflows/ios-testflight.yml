# L'app iPhone compilee par un Mac de GitHub, puis envoyee a TestFlight. Lancement A LA MAIN seulement :
# onglet Actions > « iPhone vers TestFlight » > Run workflow.
#   - « envoyer » decoche : compile seulement (archive sans signature). Aucun secret necessaire : sert a verifier.
#   - « envoyer » coche : signe (signature cloud d'Apple, cle API App Store Connect) et envoie a TestFlight.
# Secrets du depot (Settings > Secrets and variables > Actions) : ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID.
# Guide complet : TESTFLIGHT.md
name: iPhone vers TestFlight

on:
  workflow_dispatch:
    inputs:
      envoyer:
        description: "Envoyer a TestFlight (decoche = compiler seulement, sans secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight

jobs:
  ios:
    # Apple exige Xcode 26 et le SDK iOS 26 depuis le 28 avril 2026
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::aucun Xcode 26 sur ce Mac"; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Modules npm (versions figees par package-lock.json)
        run: npm ci

      - name: Dossier web de l'app et projet iOS
        run: |
          python3 outils/construire_www.py
          npx cap sync ios

      - name: Archive sans signature
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -80 "$RUNNER_TEMP/archive.log"; echo "::error::archive ratee"; exit 1; }
          grep -E "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties" "$RUNNER_TEMP/App.xcarchive/Info.plist"

      - name: Secrets Apple
        if: ${{ inputs.envoyer }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::le secret $v manque (TESTFLIGHT.md, etape 3)"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/cle"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/cle/AuthKey_$ASC_KEY_ID.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/cle/AuthKey_$ASC_KEY_ID.p8" || { echo "::error::ASC_KEY_P8 n'est pas une cle .p8 complete"; exit 1; }
          sed "s/EQUIPE/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Signer et envoyer a TestFlight
        if: ${{ inputs.envoyer }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/cle/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { tail -80 "$RUNNER_TEMP/export.log"; echo "::error::signature ou envoi rate"; exit 1; }
          tail -20 "$RUNNER_TEMP/export.log"
          echo "Build ${{ github.run_number }} envoyee. Elle apparait dans TestFlight apres le traitement d'Apple (5 a 30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Effacer la cle
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/cle"

      - name: Journaux de compilation
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: journaux-ios-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 14
